spring:
  application:
    name: twitterlike

  datasource:
    url: jdbc:sqlite:./data/twitterlike.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  batch:
    job:
      enabled: false

  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always
