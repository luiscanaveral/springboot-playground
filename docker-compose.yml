version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: twitterlike-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=[]
    volumes:
      - neo4j_data:/data

  sqlite:
    image: alpine:3.19
    container_name: twitterlike-sqlite
    volumes:
      - ./data:/data
    command: tail -f /dev/null

volumes:
  neo4j_data:
