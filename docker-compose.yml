version: '3.8'

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: twitterlike-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=[]
    volumes:
      - ./.local/neo4j_data:/data

  sqlite:
    image: alpine:3.19
    container_name: twitterlike-sqlite
    volumes:
      - ./.local/sqlite_data:/data
    command: tail -f /dev/null

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: twitterlike-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongP@ssw0rd!
      - MSSQL_PID=Express
    volumes:
      - ./.local/sqlserver_data:/var/opt/mssql

  redis:
    image: redis:7.2-alpine
    container_name: twitterlike-redis
    ports:
      - "6379:6379"
    volumes:
      - ./.local/redis_data:/data
    command: redis-server --appendonly yes

volumes:
  neo4j_data:
  sqlserver_data:
